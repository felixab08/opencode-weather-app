name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # Lee la versión del package.json y decide si hace falta crear un tag nuevo
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.inspect.outputs.version }}
      should_release: ${{ steps.inspect.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4

      - name: Comparar versión del package.json con el último tag
        id: inspect
        shell: bash
        run: |
          VERSION=$(jq -r .version package.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::package.json no tiene campo \"version\""
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/v${VERSION}" | grep -q .; then
            echo "El tag v${VERSION} ya existe; no se genera release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag nuevo v${VERSION} pendiente de crear."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  # Construye el binario con `bun run build` en cada plataforma
  build:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: weather-linux-x64
          - os: windows-latest
            artifact: weather-windows-x64.exe
          - os: macos-latest
            artifact: weather-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependencias
        run: bun install

      - name: Construir binario (tests + typecheck + compile)
        run: bun run build

      - name: Renombrar binario
        shell: bash
        run: mv weather* ${{ matrix.artifact }}

      - name: Subir binario como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # Crea el tag (si no existe) y el release con los tres binarios
  release:
    needs: [check, build]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Crear tag y release con los binarios
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: v${{ needs.check.outputs.version }}
          generate_release_notes: true
          files: dist/weather-*
